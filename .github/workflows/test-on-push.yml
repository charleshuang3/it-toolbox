name: Test on Push

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.3.0

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 25

    - name: Run backend tests
      run: |
        go test -v ./...
      working-directory: ./backend

    - name: Run frontend formatter check, linter and tests
      run: |
        pnpm install --frozen-lockfile
        pnpm run lint
        pnpm run fmt:check
        pnpm run test:run
      working-directory: ./frontend
