<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient for depth -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Code prompt gradient -->
    <linearGradient id="promptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop shadow for inner elements -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Squircle with subtle border outline -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bgGrad)" stroke="#334155" stroke-width="1" />

  <!-- Terminal Content Group with subtle drop shadow -->
  <g filter="url(#shadow)">
    <!-- Terminal Prompt: > -->
    <path d="M7.5 10L13.5 16L7.5 22" fill="none" stroke="url(#promptGrad)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cursor: _ -->
    <path d="M16 22H24.5" fill="none" stroke="#f1f5f9" stroke-width="2.75" stroke-linecap="round" />
  </g>
</svg>
